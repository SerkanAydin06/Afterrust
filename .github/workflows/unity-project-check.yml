name: Unity project structure
on:
  push:
    paths:
      - 'Assets/**'
      - 'Packages/**'
      - 'ProjectSettings/**'
      - '.github/workflows/unity-project-check.yml'
  pull_request:
    paths:
      - 'Assets/**'
      - 'Packages/**'
      - 'ProjectSettings/**'
      - '.github/workflows/unity-project-check.yml'
permissions:
  contents: read
jobs:
  structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify minimal Unity project
        shell: bash
        run: |
          set -euo pipefail
          python3 -m json.tool Packages/manifest.json >/dev/null
          grep -q '6000.3.' ProjectSettings/ProjectVersion.txt
          test -s Assets/Editor/ShelterBuilder.cs
          test -s Assets/Scripts/Player/AfterrustFirstPersonController.cs
          test -s Assets/Scripts/Gameplay/SalvageablePart.cs
          test -s Assets/Scripts/Gameplay/AfterrustInteraction.cs
          test -s Assets/Scripts/Gameplay/AfterrustInventory.cs
          test -s Assets/Scripts/Survival/SaveSystem.cs
          test -s Assets/Scripts/Survival/Crafting.cs
          test -s Assets/Tests/EditMode/Afterrust.EditModeTests.asmdef
          test -s Assets/Editor/AfterrustSceneSync.cs
          python3 - <<'PY'
          import json
          from pathlib import Path

          plan = json.loads(Path("Assets/Resources/qa_screenshot_plan.json").read_text())
          assert plan["enabled"] is True
          assert 3 <= len(plan["views"]) <= 12
          assert len({v["id"] for v in plan["views"]}) == len(plan["views"])
          assert all(25 <= v["fieldOfView"] <= 100 for v in plan["views"])
          assert all(v.get("position") and v.get("rotation") for v in plan["views"])
          assert json.loads(Path("Assets/Tests/EditMode/Afterrust.EditModeTests.asmdef").read_text())["name"] == "Afterrust.EditModeTests"
          assert "m_Name: Player" in Path("Assets/Scenes/AfterrustPrototype.unity").read_text()
          scene_sync = Path("Assets/Editor/AfterrustSceneSync.cs").read_text()
          assert "private const int Latest = 9" in scene_sync
          assert "ScrapyardEnvironmentBuilder.EnsureSafeZoneGate" in scene_sync
          assert "ShelterBuilder.AlignTradeStallRoof" in scene_sync
          assert "FirstExpeditionBuilder.PauseExpedition" in scene_sync
          assert "ShelterBuilder.EnsureRainColliders" in scene_sync
          assert "FirstExpeditionBuilder.Build" in scene_sync
          assert "FirstExpeditionBuilder.EnableAudio" in scene_sync

          for relative in (
              "Assets/Editor/FirstExpeditionBuilder.cs",
              "Assets/Scripts/World/ToxicExposure.cs",
              "Assets/Scripts/Ambience/AfterrustAudio.cs",
              "Assets/Scripts/Gameplay/FirstExpeditionGuide.cs",
              "Assets/Tests/EditMode/ExpeditionRulesTests.cs",
          ):
              path = Path(relative)
              assert path.is_file() and path.stat().st_size > 0, relative
              meta = Path(relative + ".meta")
              assert meta.is_file(), relative + " is missing its stable .meta"
              guid = next(line.split(": ", 1)[1] for line in meta.read_text().splitlines() if line.startswith("guid: "))
              assert len(guid) == 32 and all(c in "0123456789abcdef" for c in guid), relative

          assert "09_first_expedition" in {view["id"] for view in plan["views"]}
          assert "10_relief_kiosk" in {view["id"] for view in plan["views"]}
          assert "11_toxic_depot" in {view["id"] for view in plan["views"]}
          assert "AddRainBarrier" in Path("Assets/Editor/ShelterBuilder.cs").read_text()
          weather = Path("Assets/Scripts/World/DayNightWeather.cs").read_text()
          assert "EmitRoofAwareRain" in weather and "LifetimeToSurface" in weather
          audio = Path("Assets/Scripts/Ambience/AfterrustAudio.cs").read_text()
          assert "ContinuousAmbientNoise" in audio and "GenerateAmbient" in audio
          assert Path("Assets/Tests/EditMode/RainAndAudioTests.cs").is_file()
          assert Path("Assets/Tests/EditMode/RainAndAudioTests.cs.meta").is_file()
          gate_source = Path("Assets/Scripts/World/SafeZoneGate.cs")
          assert gate_source.is_file()
          assert "GetPrompt" in gate_source.read_text() and "SetOpen" in gate_source.read_text()
          assert Path(str(gate_source) + ".meta").is_file()
          gate_tests = Path("Assets/Tests/EditMode/SafeZoneGateTests.cs")
          assert gate_tests.is_file() and Path(str(gate_tests) + ".meta").is_file()
          yard = Path("Assets/Editor/ScrapyardEnvironmentBuilder.cs").read_text()
          assert "EnsureSafeZoneGate" in yard and "AddGateLeaf" in yard
          shelter = Path("Assets/Editor/ShelterBuilder.cs").read_text()
          assert "AlignTradeStallRoof" in shelter and "EnsureTradeStallSupports" in shelter
          save = Path("Assets/Scripts/Survival/SaveSystem.cs").read_text()
          assert "foreach (SafeZoneGate gate" in save
          assert "footstepsVolume = 0.10f" in audio
          print("V9 safe-yard gate, trader roof and footstep mix structure validated.")
          PY
          echo "Static checks passed. Actual Unity compilation runs in the optional licensed job."
  unity-editmode:
    # Activate after adding an appropriate Unity license in repository Secrets.
    # Repository variable UNITY_CI_ENABLED=true opts in without breaking unconfigured forks.
    if: ${{ vars.UNITY_CI_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Run Unity 6.3 EditMode tests
        id: unity-tests
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: .
          unityVersion: 6000.3.27f2
          testMode: editmode
          githubToken: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload Unity test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: afterrust-editmode-tests
          path: ${{ steps.unity-tests.outputs.artifactsPath }}
          retention-days: 14
