name: Unity project structure
on:
  push:
    paths:
      - 'Assets/**'
      - 'Packages/**'
      - 'ProjectSettings/**'
      - '.github/workflows/unity-project-check.yml'
  pull_request:
    paths:
      - 'Assets/**'
      - 'Packages/**'
      - 'ProjectSettings/**'
      - '.github/workflows/unity-project-check.yml'
permissions:
  contents: read
jobs:
  structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify minimal Unity project
        shell: bash
        run: |
          set -euo pipefail
          python3 -m json.tool Packages/manifest.json >/dev/null
          grep -q '6000.3.' ProjectSettings/ProjectVersion.txt
          test -s Assets/Editor/ShelterBuilder.cs
          test -s Assets/Scripts/Player/AfterrustFirstPersonController.cs
          test -s Assets/Scripts/Gameplay/SalvageablePart.cs
          test -s Assets/Scripts/Gameplay/AfterrustInteraction.cs
          test -s Assets/Scripts/Gameplay/AfterrustInventory.cs
          test -s Assets/Scripts/Survival/SaveSystem.cs
          test -s Assets/Scripts/Survival/Crafting.cs
          test -s Assets/Tests/EditMode/Afterrust.EditModeTests.asmdef
          test -s Assets/Editor/AfterrustSceneSync.cs
          python3 - <<'PY'
          import json
          from pathlib import Path

          plan = json.loads(Path("Assets/Resources/qa_screenshot_plan.json").read_text())
          assert plan["enabled"] is True
          assert 3 <= len(plan["views"]) <= 16
          assert len({v["id"] for v in plan["views"]}) == len(plan["views"])
          assert all(25 <= v["fieldOfView"] <= 100 for v in plan["views"])
          assert all(v.get("position") and v.get("rotation") for v in plan["views"])
          assert json.loads(Path("Assets/Tests/EditMode/Afterrust.EditModeTests.asmdef").read_text())["name"] == "Afterrust.EditModeTests"
          assert "m_Name: Player" in Path("Assets/Scenes/AfterrustPrototype.unity").read_text()
          scene_sync = Path("Assets/Editor/AfterrustSceneSync.cs").read_text()
          assert "private const int Latest = 16" in scene_sync
          assert "ShelterInteriorLightingPass.Apply" in scene_sync
          assert "ShelterInteriorMaterialPass.Apply" in scene_sync
          assert "ShelterStorageBuilder.EnsureStorage" in scene_sync
          assert "ScrapyardEnvironmentBuilder.RemoveSafeZoneSign" in scene_sync
          assert "ShelterBuilder.EnsureTraderNightLight" in scene_sync
          assert "RainCollectorBuilder.Apply" in scene_sync
          assert "ScrapyardEnvironmentBuilder.EnsureSafeZoneGate" in scene_sync
          assert "ShelterBuilder.AlignTradeStallRoof" in scene_sync
          assert "FirstExpeditionBuilder.PauseExpedition" in scene_sync
          assert "ShelterBuilder.EnsureRainColliders" in scene_sync
          assert "FirstExpeditionBuilder.Build" in scene_sync
          assert "FirstExpeditionBuilder.EnableAudio" in scene_sync

          for relative in (
              "Assets/Editor/FirstExpeditionBuilder.cs",
              "Assets/Scripts/World/ToxicExposure.cs",
              "Assets/Scripts/Ambience/AfterrustAudio.cs",
              "Assets/Scripts/Gameplay/FirstExpeditionGuide.cs",
              "Assets/Tests/EditMode/ExpeditionRulesTests.cs",
          ):
              path = Path(relative)
              assert path.is_file() and path.stat().st_size > 0, relative
              meta = Path(relative + ".meta")
              assert meta.is_file(), relative + " is missing its stable .meta"
              guid = next(line.split(": ", 1)[1] for line in meta.read_text().splitlines() if line.startswith("guid: "))
              assert len(guid) == 32 and all(c in "0123456789abcdef" for c in guid), relative

          assert "09_first_expedition" in {view["id"] for view in plan["views"]}
          assert "10_relief_kiosk" in {view["id"] for view in plan["views"]}
          assert "11_toxic_depot" in {view["id"] for view in plan["views"]}
          assert "AddRainBarrier" in Path("Assets/Editor/ShelterBuilder.cs").read_text()
          weather = Path("Assets/Scripts/World/DayNightWeather.cs").read_text()
          assert "EmitRoofAwareRain" in weather and "LifetimeToSurface" in weather
          audio = Path("Assets/Scripts/Ambience/AfterrustAudio.cs").read_text()
          assert "ContinuousAmbientNoise" in audio and "GenerateAmbient" in audio
          assert Path("Assets/Tests/EditMode/RainAndAudioTests.cs").is_file()
          assert Path("Assets/Tests/EditMode/RainAndAudioTests.cs.meta").is_file()
          gate_source = Path("Assets/Scripts/World/SafeZoneGate.cs")
          assert gate_source.is_file()
          assert "GetPrompt" in gate_source.read_text() and "SetOpen" in gate_source.read_text()
          assert Path(str(gate_source) + ".meta").is_file()
          gate_tests = Path("Assets/Tests/EditMode/SafeZoneGateTests.cs")
          assert gate_tests.is_file() and Path(str(gate_tests) + ".meta").is_file()
          yard = Path("Assets/Editor/ScrapyardEnvironmentBuilder.cs").read_text()
          assert "EnsureSafeZoneGate" in yard and "AddGateLeaf" in yard
          shelter = Path("Assets/Editor/ShelterBuilder.cs").read_text()
          assert "AlignTradeStallRoof" in shelter and "EnsureTradeStallSupports" in shelter
          save = Path("Assets/Scripts/Survival/SaveSystem.cs").read_text()
          assert "foreach (SafeZoneGate gate" in save
          assert "footstepsVolume = 0.10f" in audio
          assert "12_safe_zone_gate" in {view["id"] for view in plan["views"]}
          assert "13_open_rain_collector" in {view["id"] for view in plan["views"]}
          assert "14_shelter_storage" in {view["id"] for view in plan["views"]}
          assert len(plan["views"]) == 14
          rain_builder = Path("Assets/Editor/RainCollectorBuilder.cs")
          rain_tests = Path("Assets/Tests/EditMode/RainCollectorTests.cs")
          assert rain_builder.is_file() and Path(str(rain_builder) + ".meta").is_file()
          assert rain_tests.is_file() and Path(str(rain_tests) + ".meta").is_file()
          meshkit = Path("Assets/Editor/MeshKit.cs").read_text()
          assert "OpenBarrel" in meshkit
          water = Path("Assets/Scripts/Survival/WaterSource.cs").read_text()
          assert "secondsToFill = 900f" in water and "Accumulate" in water
          assert "hasContinuousFill" in save
          assert "RainCollectorBuilder.Place(p)" in shelter
          assert "case \"Oil Drum\"" not in Path("Assets/Editor/SurvivalSetup.cs").read_text()
          assert plan["captureAtFixedDaytime"] is True
          assert 9 <= plan["captureHour"] <= 14
          qa_runner = Path("Assets/Scripts/QA/AfterrustScreenshotRunner.cs").read_text()
          assert "captureAtFixedDaytime" in qa_runner
          assert "weather.Restore(originalHour" in qa_runner
          assert "capturedGameHour" in qa_runner
          assert "LegacyV9YardPathOf" in save
          legacy_tests = Path("Assets/Tests/EditMode/LegacyYardSaveTests.cs")
          assert legacy_tests.is_file() and Path(str(legacy_tests) + ".meta").is_file()
          assert "RemoveSafeZoneSign" in yard
          assert 'new GameObject("Safe Zone Name")' not in yard
          assert '"Entrance Name Plate", paint' not in yard
          assert "EnsureTraderNightLight" in shelter
          assert "0.12f * (1f - rainBlend" in weather
          fps_hud = Path("Assets/Scripts/Survival/SurvivalHud.cs").read_text()
          assert "Time.unscaledDeltaTime" in fps_hud
          assert "fpsSampleSeconds >= FpsRefreshSeconds" in fps_hud
          assert "fpsLabel" in fps_hud and '" ms"' in fps_hud
          assert 'new Rect(sw - 176f, 51f, 162f, 25f)' in fps_hud
          storage = Path("Assets/Scripts/Survival/ShelterStorage.cs")
          storage_builder = Path("Assets/Editor/ShelterStorageBuilder.cs")
          storage_tests = Path("Assets/Tests/EditMode/ShelterStorageTests.cs")
          for path in (storage, storage_builder, storage_tests):
              assert path.is_file() and path.stat().st_size > 0
              assert Path(str(path) + ".meta").is_file()
          storage_source = storage.read_text()
          assert "StoreOne" in storage_source and "TakeOne" in storage_source
          assert "Snapshot" in storage_source and "Restore" in storage_source
          assert 'ShelterStorageBuilder.EnsureStorage();' in shelter
          hud = Path("Assets/Scripts/Survival/SurvivalHud.cs").read_text()
          assert "DrawStorageColumn" in hud and "OpenStorage" in hud
          assert "List<StorageState> storages" in save
          assert "storage.Snapshot()" in save and "storage.Restore(state.items)" in save
          assert 'chest.localPosition = new Vector3(2.95f, 0f, 1.45f)' in storage_builder.read_text()
          trader_source = Path("Assets/Scripts/Gameplay/AfterrustTrader.cs").read_text()
          trader_tests = Path("Assets/Tests/EditMode/TraderMarketTests.cs")
          assert trader_tests.is_file() and Path(str(trader_tests) + ".meta").is_file()
          assert "OpenTrader(this)" in trader_source
          assert "SellOne(AfterrustInventory" in trader_source
          assert "Buy(AfterrustInventory" in trader_source
          assert "TryAddItem(id) != 1" in trader_source
          assert "DrawTrader(sw, sh)" in hud and "OpenTrader" in hud
          assert "Panel { None, Inventory, Crafting, Storage, Trader }" in hud
          interaction = Path("Assets/Scripts/Gameplay/AfterrustInteraction.cs").read_text()
          assert "trader.BuyWireCutter" not in interaction
          assert 'Tüccar — E: hurda sat' not in trader_source
          assert len(plan["views"]) == 14
          visual = Path("Assets/Editor/ShelterInteriorMaterialPass.cs")
          assert visual.is_file() and Path(str(visual) + ".meta").is_file()
          visual_source = visual.read_text()
          assert "private static Palette CreatePalette()" in visual_source
          assert "M_V15_Interior_DustySlab" in visual_source
          assert "M_V15_Interior_WarmCinder" in visual_source
          assert "M_V15_Interior_ColdCinder" in visual_source
          assert "M_V15_Interior_DarkReclaimedWood" in visual_source
          assert "M_V15_Interior_BlackenedStove" in visual_source
          assert "GetComponentsInChildren<MeshRenderer>" in visual_source
          assert "AssetDatabase.SaveAssets()" in visual_source
          assert "ShelterInteriorMaterialPass.Apply();" in shelter
          assert "BuildShell(" not in visual_source and "DestroyImmediate(" not in visual_source
          live_plan = Path("docs/DEVELOPMENT_PLAN.md")
          assert live_plan.is_file() and "AR-1501" in live_plan.read_text()
          assert "AR-1502" in live_plan.read_text() and "AR-1601" in live_plan.read_text()
          assert "docs/DEVELOPMENT_PLAN.md" in Path("AGENTS.md").read_text()
          lighting = Path("Assets/Editor/ShelterInteriorLightingPass.cs")
          assert lighting.is_file() and Path(str(lighting) + ".meta").is_file()
          light_source = lighting.read_text()
          assert 'FindInScene("Scrapyard Lamps")' in light_source
          assert 'workLight.type = LightType.Spot' in light_source
          assert 'workLight.shadows = LightShadows.None' in light_source
          assert 'pendantLight.shadows = LightShadows.Hard' in light_source
          assert 'stove.fireLight.range = 3.8f' in light_source
          assert 'stove.glowOff = matteStove' in light_source
          assert "MakeFixture(root" in light_source
          assert "EnsureLight(workbench" in light_source
          assert "EnsureLight(pendant" in light_source
          assert "SyncWeatherReferences(root)" in light_source
          assert "new GameObject(\"Scrapyard Lamps\")" in light_source
          assert "V15.2: interior wall lamp or pendant not found." not in light_source
          lamp_recovery_tests = Path("Assets/Tests/EditMode/InteriorLampRecoveryTests.cs")
          assert lamp_recovery_tests.is_file()
          assert Path(str(lamp_recovery_tests) + ".meta").is_file()
          atmosphere = Path("Assets/Editor/ScrapyardAtmosphereSetup.cs").read_text()
          assert "ShelterInteriorLightingPass.Apply();" in atmosphere
          plan_text = live_plan.read_text()
          assert '| AR-1502 | [~]' in plan_text
          assert 'AR-Q005' in live_plan.read_text()
          print("V15.2 lighting migration now recovers missing fixtures and re-registers weather safely.")
          PY
          echo "Static checks passed. Actual Unity compilation runs in the optional licensed job."
  unity-editmode:
    # Activate after adding an appropriate Unity license in repository Secrets.
    # Repository variable UNITY_CI_ENABLED=true opts in without breaking unconfigured forks.
    if: ${{ vars.UNITY_CI_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Run Unity 6.3 EditMode tests
        id: unity-tests
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: .
          unityVersion: 6000.3.27f2
          testMode: editmode
          githubToken: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload Unity test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: afterrust-editmode-tests
          path: ${{ steps.unity-tests.outputs.artifactsPath }}
          retention-days: 14
